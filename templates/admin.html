<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理后台 · AI Engineer Mentor</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f3f4f6;--surface3:#e5e7eb;
  --border:#e5e7eb;--border2:#d1d5db;
  --teal:#0d9488;--teal-dim:rgba(13,148,136,0.10);
  --red:#dc2626;--red-dim:rgba(220,38,38,0.10);
  --green:#16a34a;--green-dim:rgba(22,163,74,0.10);
  --yellow:#ca8a04;--yellow-dim:rgba(202,138,4,0.10);
  --blue:#2563eb;--purple:#9333ea;
  --text:#111827;--muted:#4b5563;--muted2:#6b7280;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Sora',sans-serif}

/* ── Topbar ── */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.admin-badge{padding:2px 10px;background:rgba(244,112,103,.15);border:1px solid rgba(244,112,103,.3);border-radius:4px;font-size:11px;color:var(--red);font-family:'JetBrains Mono',monospace;font-weight:600}
.topbar-title{font-size:15px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.btn-outline{padding:5px 14px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--muted);font-size:12px;font-family:'Sora',sans-serif;cursor:pointer;transition:all .2s}
.btn-outline:hover{border-color:var(--teal);color:var(--teal)}
.btn-outline.danger:hover{border-color:var(--red);color:var(--red)}

/* ── Layout ── */
.layout{display:flex;height:calc(100vh - 52px)}

/* ── Left sidebar ── */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);flex-shrink:0;padding:16px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--teal-dim);color:var(--teal);border-left-color:var(--teal)}
.nav-section{font-size:10px;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace;padding:14px 18px 5px}

/* ── Main ── */
.main{flex:1;overflow-y:auto;padding:24px}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.page{display:none}
.page.active{display:block}

/* ── Stat cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:18px 20px}
.stat-num{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-card.teal .stat-num{color:var(--teal)}
.stat-card.green .stat-num{color:var(--green)}
.stat-card.blue .stat-num{color:var(--blue)}
.stat-card.red .stat-num{color:var(--red)}

/* ── Section header ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600}
.btn-primary{padding:7px 16px;background:var(--teal);color:#0d1117;border:none;border-radius:7px;font-size:12px;font-weight:700;font-family:'Sora',sans-serif;cursor:pointer;transition:filter .2s}
.btn-primary:hover{filter:brightness(1.1)}

/* ── Table ── */
.table-wrap{background:var(--surface);border:1px solid var(--border2);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.6px;font-family:'JetBrains Mono',monospace;padding:10px 16px;text-align:left;border-bottom:1px solid var(--border2);white-space:nowrap}
td{padding:11px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:600}
.badge.banned{background:var(--red-dim);color:var(--red);border:1px solid rgba(244,112,103,.3)}
.badge.active{background:var(--green-dim);color:var(--green);border:1px solid rgba(63,185,80,.3)}
.badge.admin{background:rgba(210,168,255,.1);color:var(--purple);border:1px solid rgba(210,168,255,.3)}
.action-btns{display:flex;gap:6px}
.btn-sm{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;cursor:pointer;border:1px solid;transition:all .15s}
.btn-sm.view{color:var(--teal);border-color:rgba(13,148,136,.3);background:var(--teal-dim)}
.btn-sm.view:hover{background:rgba(13,148,136,.20)}
.btn-sm.ban{color:var(--red);border-color:rgba(220,38,38,.3);background:var(--red-dim)}
.btn-sm.ban:hover{background:rgba(220,38,38,.20)}
.btn-sm.unban{color:var(--green);border-color:rgba(22,163,74,.3);background:var(--green-dim)}
.btn-sm.unban:hover{background:rgba(22,163,74,.20)}
.btn-sm.reset{color:var(--yellow);border-color:rgba(202,138,4,.3);background:var(--yellow-dim)}
.btn-sm.reset:hover{background:rgba(202,138,4,.20)}
.btn-sm.del{color:var(--red);border-color:rgba(220,38,38,.2);background:transparent}
.btn-sm.del:hover{background:var(--red-dim)}

/* ── Chat viewer (right panel) ── */
.chat-viewer{display:flex;height:calc(100vh - 52px);overflow:hidden}
.cv-users{width:220px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.cv-users::-webkit-scrollbar{width:3px}
.cv-users::-webkit-scrollbar-thumb{background:var(--border2)}
.cv-user-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.cv-user-item:hover{background:var(--surface2)}
.cv-user-item.active{background:var(--teal-dim)}
.cv-user-name{font-size:13px;font-weight:600}
.cv-user-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:3px}
.cv-convs{width:240px;border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.cv-convs::-webkit-scrollbar{width:3px}
.cv-convs::-webkit-scrollbar-thumb{background:var(--border2)}
.cv-conv-item{padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.cv-conv-item:hover{background:var(--surface2)}
.cv-conv-item.active{background:var(--teal-dim)}
.cv-conv-title{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-conv-meta{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:3px}
.cv-messages{flex:1;overflow-y:auto;padding:20px}
.cv-messages::-webkit-scrollbar{width:4px}
.cv-messages::-webkit-scrollbar-thumb{background:var(--border2)}
.cv-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted2);font-size:13px;font-family:'JetBrains Mono',monospace}
.cv-section-label{font-size:11px;color:var(--muted2);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.8px;padding:10px 16px 5px}

/* Messages in viewer */
.msg-row{display:flex;gap:10px;margin-bottom:14px}
.msg-row.user{flex-direction:row-reverse}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.msg-av.ai{background:linear-gradient(135deg,var(--teal),#0f766e);color:#ffffff}
.msg-av.user{background:var(--surface2);border:1px solid var(--border2)}
.msg-bbl{max-width:75%;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg-row.ai  .msg-bbl{background:var(--surface2);border:1px solid var(--border);border-top-left-radius:3px}
.msg-row.user .msg-bbl{background:#1f3a4a;border:1px solid rgba(57,208,192,.2);border-top-right-radius:3px}
.msg-time{font-size:10px;color:var(--muted2);font-family:'JetBrains Mono',monospace;margin-top:4px;text-align:right}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:28px;width:380px;animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-label{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-family:'Sora',sans-serif;font-size:14px;padding:9px 13px;outline:none;margin-bottom:14px;transition:border-color .2s}
.modal-input:focus{border-color:var(--teal)}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.modal-err{font-size:12px;color:var(--red);font-family:'JetBrains Mono',monospace;margin-bottom:10px;display:none}
.modal-err.show{display:block}

/* Loading */
.loading{text-align:center;padding:40px;color:var(--muted2);font-family:'JetBrains Mono',monospace;font-size:13px}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">🤖 AI Engineer Mentor</span>
    <span class="admin-badge">⚡ 管理后台</span>
  </div>
  <div class="topbar-right">
    <span id="adminName"></span>
    <a href="/" style="text-decoration:none"><button class="btn-outline">← 返回主界面</button></a>
    <button class="btn-outline danger" onclick="doLogout()">退出登录</button>
  </div>
</div>

<div class="layout">
  <!-- Left nav -->
  <div class="sidebar">
    <div class="nav-section">概览</div>
    <div class="nav-item active" onclick="showPage('dashboard')">📊 数据概览</div>
    <div class="nav-section">用户管理</div>
    <div class="nav-item" onclick="showPage('users')">👥 用户列表</div>
    <div class="nav-item" onclick="showPage('chats')">💬 聊天记录</div>
    <div class="nav-section">系统</div>
    <div class="nav-item" onclick="showPage('rag')">📚 知识库</div>
  </div>

  <!-- Dashboard page -->
  <div class="main" id="pageDashboard" style="display:block">
    <div class="stat-grid" id="statGrid">
      <div class="stat-card teal"><div class="stat-num" id="sUsers">—</div><div class="stat-label">注册用户数</div></div>
      <div class="stat-card green"><div class="stat-num" id="sConvs">—</div><div class="stat-label">对话总数</div></div>
      <div class="stat-card blue"><div class="stat-num" id="sMsgs">—</div><div class="stat-label">消息总数</div></div>
      <div class="stat-card red"><div class="stat-num" id="sBanned">—</div><div class="stat-label">封禁用户</div></div>
    </div>
    <div class="section-header"><div class="section-title">最近用户</div></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>用户名</th><th>注册时间</th><th>对话数</th><th>消息数</th><th>状态</th></tr></thead>
        <tbody id="dashUserTable"><tr><td colspan="5" class="loading">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- RAG 管理页 -->
  <div class="main" id="pageRag" style="display:none">
    <div class="section-header">
      <div class="section-title">�� 知识库管理</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:22px;max-width:680px">
      <div style="font-size:13px;line-height:1.8;color:var(--text);margin-bottom:14px">
        这里可以一键清空所有用户上传到知识库的内容（向量库中的所有片段与文档）。<br>
        <strong style="color:var(--red)">⚠ 此操作不可恢复</strong>——用户的对话、消息、账号都不会被影响。
      </div>
      <div id="ragSummary" style="font-size:12px;color:var(--muted);margin-bottom:14px;font-family:'JetBrains Mono',monospace">加载中…</div>
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn-outline danger" onclick="clearAllRag()" id="clearRagBtn" style="padding:8px 18px;border:1px solid var(--red);border-radius:7px;background:transparent;color:var(--red);font-size:13px;font-family:'Sora',sans-serif;font-weight:600;cursor:pointer">�� 清空所有用户知识库</button>
        <button class="btn-outline" onclick="loadRagSummary()" style="padding:8px 14px">�� 刷新</button>
      </div>


  <!-- Users page -->
  <div class="main" id="pageUsers" style="display:none">
    <div class="section-header">
      <div class="section-title">用户列表</div>
      <button class="btn-primary" onclick="openCreateUser()">＋ 新建用户</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>用户名</th><th>注册时间</th><th>对话数</th><th>消息数</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="userTable"><tr><td colspan="7" class="loading">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Chat viewer page (full width, no padding) -->
  <div id="pageChats" style="display:none;flex:1;overflow:hidden" class="chat-viewer">
    <!-- User list -->
    <div class="cv-users" id="cvUsers">
      <div class="cv-section-label">用户列表</div>
      <div class="loading">加载中…</div>
    </div>
    <!-- Conversation list -->
    <div class="cv-convs" id="cvConvs">
      <div class="cv-section-label">对话记录</div>
      <div class="cv-empty">← 选择用户</div>
    </div>
    <!-- Messages -->
    <div class="cv-messages" id="cvMessages">
      <div class="cv-empty">← 选择对话</div>
    </div>
  </div>
</div>

<!-- Modal: create user -->
<div class="modal-overlay" id="modalCreateUser">
  <div class="modal">
    <div class="modal-title">➕ 新建用户</div>
    <div class="modal-label">用户名</div>
    <input class="modal-input" id="newUsername" placeholder="输入用户名">
    <div class="modal-label">初始密码</div>
    <input class="modal-input" id="newPassword" type="password" placeholder="至少 6 位">
    <div class="modal-err" id="createErr"></div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal('modalCreateUser')">取消</button>
      <button class="btn-primary" onclick="doCreateUser()">创建</button>
    </div>
  </div>
</div>

<!-- Modal: reset password -->
<div class="modal-overlay" id="modalResetPw">
  <div class="modal">
    <div class="modal-title">🔑 重置密码</div>
    <div class="modal-label">用户：<span id="resetUsername" style="color:var(--teal)"></span></div>
    <div style="margin-bottom:12px"></div>
    <div class="modal-label">新密码</div>
    <input class="modal-input" id="resetPwInput" type="password" placeholder="至少 6 位">
    <div class="modal-err" id="resetErr"></div>
    <div class="modal-footer">
      <button class="btn-outline" onclick="closeModal('modalResetPw')">取消</button>
      <button class="btn-primary" onclick="doResetPw()">确认重置</button>
    </div>
  </div>
</div>

<script>
let currentResetUid = null;
let cvSelectedUser = null;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  const r = await fetch('/api/me');
  if(!r.ok){ location.href='/'; return; }
  const u = await r.json();
  if(!u.is_admin){ location.href='/'; return; }
  document.getElementById('adminName').textContent = '👤 ' + u.username;
  loadDashboard();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function showPage(p){
  document.querySelectorAll('.main,[id^=pageChats]').forEach(el=>el.style.display='none');
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));

  if(p==='dashboard'){
    document.getElementById('pageDashboard').style.display='block';
    document.querySelectorAll('.nav-item')[0].classList.add('active');
    loadDashboard();
  }else if(p==='users'){
    document.getElementById('pageUsers').style.display='block';
    document.querySelectorAll('.nav-item')[1].classList.add('active');
    loadUsers();
  }else if(p==='chats'){
    document.getElementById('pageChats').style.display='flex';
    document.querySelectorAll('.nav-item')[2].classList.add('active');
    loadChatUsers();
  }
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function loadDashboard(){
  const [stats, users] = await Promise.all([
    fetch('/api/admin/stats').then(r=>r.json()),
    fetch('/api/admin/users').then(r=>r.json()),
  ]);
  document.getElementById('sUsers').textContent  = stats.total_users;
  document.getElementById('sConvs').textContent  = stats.total_convs;
  document.getElementById('sMsgs').textContent   = stats.total_messages;
  document.getElementById('sBanned').textContent = stats.banned_users;

  const tbody = document.getElementById('dashUserTable');
  if(!users.length){ tbody.innerHTML='<tr><td colspan="5" style="color:var(--muted2);text-align:center;padding:20px">暂无用户</td></tr>'; return; }
  tbody.innerHTML = users.slice(0,8).map(u=>`
    <tr>
      <td><span style="font-family:'JetBrains Mono',monospace;font-weight:600">${escHtml(u.username)}</span></td>
      <td style="color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace">${u.created_at?.slice(0,10)||'—'}</td>
      <td><span style="font-family:'JetBrains Mono',monospace">${u.conv_count}</span></td>
      <td><span style="font-family:'JetBrains Mono',monospace">${u.msg_count}</span></td>
      <td>${u.is_banned
        ? '<span class="badge banned">已封禁</span>'
        : '<span class="badge active">正常</span>'}</td>
    </tr>`).join('');
}

// ── Users Table ───────────────────────────────────────────────────────────────
async function loadUsers(){
  const users = await fetch('/api/admin/users').then(r=>r.json());
  const tbody = document.getElementById('userTable');
  if(!users.length){ tbody.innerHTML='<tr><td colspan="7" style="color:var(--muted2);text-align:center;padding:20px">暂无用户</td></tr>'; return; }
  tbody.innerHTML = users.map(u=>`
    <tr id="urow-${u.id}">
      <td style="color:var(--muted2);font-family:'JetBrains Mono',monospace">#${u.id}</td>
      <td><span style="font-family:'JetBrains Mono',monospace;font-weight:600">${escHtml(u.username)}</span></td>
      <td style="color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace">${u.created_at?.slice(0,10)||'—'}</td>
      <td style="font-family:'JetBrains Mono',monospace">${u.conv_count}</td>
      <td style="font-family:'JetBrains Mono',monospace">${u.msg_count}</td>
      <td>${u.is_banned
        ? '<span class="badge banned">已封禁</span>'
        : '<span class="badge active">正常</span>'}</td>
      <td>
        <div class="action-btns">
          <button class="btn-sm view"  onclick="viewUserChats(${u.id},'${escHtml(u.username)}')">查看记录</button>
          <button class="btn-sm reset" onclick="openResetPw(${u.id},'${escHtml(u.username)}')">重置密码</button>
          ${u.is_banned
            ? `<button class="btn-sm unban" onclick="unbanUser(${u.id})">解封</button>`
            : `<button class="btn-sm ban"   onclick="banUser(${u.id})">封禁</button>`}
          <button class="btn-sm del" onclick="deleteUser(${u.id},'${escHtml(u.username)}')">删除</button>
        </div>
      </td>
    </tr>`).join('');
}

// ── User actions ──────────────────────────────────────────────────────────────
async function banUser(uid){
  if(!confirm('确认封禁该用户？封禁后将无法登录。')) return;
  const r = await fetch(`/api/admin/users/${uid}/ban`,{method:'POST'});
  if((await r.json()).ok) loadUsers();
}
async function unbanUser(uid){
  const r = await fetch(`/api/admin/users/${uid}/unban`,{method:'POST'});
  if((await r.json()).ok) loadUsers();
}
async function deleteUser(uid, name){
  if(!confirm(`确认删除用户「${name}」？此操作不可恢复，将同时删除其所有对话记录。`)) return;
  const r = await fetch(`/api/admin/users/${uid}`,{method:'DELETE'});
  const d = await r.json();
  if(d.ok) loadUsers();
  else alert(d.error);
}

// ── Create user modal ─────────────────────────────────────────────────────────
function openCreateUser(){
  document.getElementById('newUsername').value='';
  document.getElementById('newPassword').value='';
  document.getElementById('createErr').classList.remove('show');
  document.getElementById('modalCreateUser').classList.add('show');
}
async function doCreateUser(){
  const u=document.getElementById('newUsername').value.trim();
  const p=document.getElementById('newPassword').value;
  const err=document.getElementById('createErr');
  err.classList.remove('show');
  const r=await fetch('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await r.json();
  if(d.ok){ closeModal('modalCreateUser'); loadUsers(); }
  else{ err.textContent=d.error; err.classList.add('show'); }
}

// ── Reset password modal ──────────────────────────────────────────────────────
function openResetPw(uid, name){
  currentResetUid=uid;
  document.getElementById('resetUsername').textContent=name;
  document.getElementById('resetPwInput').value='';
  document.getElementById('resetErr').classList.remove('show');
  document.getElementById('modalResetPw').classList.add('show');
}
async function doResetPw(){
  const pw=document.getElementById('resetPwInput').value;
  const err=document.getElementById('resetErr');
  err.classList.remove('show');
  const r=await fetch(`/api/admin/users/${currentResetUid}/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  const d=await r.json();
  if(d.ok){ closeModal('modalResetPw'); alert('密码已重置'); }
  else{ err.textContent=d.error; err.classList.add('show'); }
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m)m.classList.remove('show'); }));

// ── Chat Viewer ───────────────────────────────────────────────────────────────
async function loadChatUsers(){
  const users = await fetch('/api/admin/users').then(r=>r.json());
  const el = document.getElementById('cvUsers');
  if(!users.length){ el.innerHTML='<div class="cv-section-label">用户列表</div><div class="cv-empty">暂无用户</div>'; return; }
  el.innerHTML = '<div class="cv-section-label">用户列表</div>' +
    users.map(u=>`
      <div class="cv-user-item" onclick="selectCvUser(${u.id},'${escHtml(u.username)}')" id="cvu-${u.id}">
        <div class="cv-user-name">${escHtml(u.username)}${u.is_banned?' 🚫':''}</div>
        <div class="cv-user-meta">${u.conv_count} 对话 · ${u.msg_count} 消息</div>
      </div>`).join('');
}

async function selectCvUser(uid, name){
  cvSelectedUser = uid;
  document.querySelectorAll('.cv-user-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('cvu-'+uid)?.classList.add('active');
  document.getElementById('cvMessages').innerHTML='<div class="cv-empty">← 选择对话</div>';

  const convs = await fetch(`/api/admin/users/${uid}/conversations`).then(r=>r.json());
  const el = document.getElementById('cvConvs');
  if(!convs.length){
    el.innerHTML=`<div class="cv-section-label">${escHtml(name)} 的对话</div><div class="cv-empty">暂无对话</div>`;
    return;
  }
  el.innerHTML = `<div class="cv-section-label">${escHtml(name)} 的对话</div>` +
    convs.map(c=>`
      <div class="cv-conv-item" onclick="selectCvConv(${c.id})" id="cvc-${c.id}">
        <div class="cv-conv-title">${escHtml(c.title)}</div>
        <div class="cv-conv-meta">${c.msg_count} 条消息 · ${c.created_at?.slice(0,10)||'—'}</div>
      </div>`).join('');
}

async function selectCvConv(cid){
  document.querySelectorAll('.cv-conv-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('cvc-'+cid)?.classList.add('active');

  const msgs = await fetch(`/api/admin/conversations/${cid}/messages`).then(r=>r.json());
  const el = document.getElementById('cvMessages');
  if(!msgs.length){ el.innerHTML='<div class="cv-empty">对话为空</div>'; return; }

  el.innerHTML = msgs.map(m=>`
    <div class="msg-row ${m.role==='user'?'user':'ai'}">
      <div class="msg-av ${m.role==='user'?'user':'ai'}">${m.role==='user'?'👤':'🤖'}</div>
      <div>
        <div class="msg-bbl">${escHtml(m.content)}</div>
        <div class="msg-time">${m.created_at?.slice(0,16)||''}</div>
      </div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

// 从用户列表页跳转到聊天记录并自动选中该用户
function viewUserChats(uid, name){
  showPage('chats');
  setTimeout(()=>selectCvUser(uid, name), 200);
}

// ── Misc ──────────────────────────────────────────────────────────────────────
async function doLogout(){
  await fetch('/api/logout',{method:'POST'});
  location.href='/';
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
